<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Archives S9 - ESTACUP</title>

  <link rel="stylesheet" href="style.css" />

  <script type="module" src="estacup-s9.js" defer></script>

  <style>
    /* Styles pour l’affichage des classements de course */
    .race-item { margin-bottom:10px; }
    .race-btn {
      background:#0b1220; border:1px solid #1e293b; color:#e2e8f0;
      padding:8px 10px; border-radius:8px; width:100%; text-align:left; cursor:pointer;
    }
    .race-btn:hover { border-color:#38bdf8; }
    .race-classification {
      margin:8px 0 0 0; padding:10px; border:1px dashed #334155; border-radius:8px; background:#0a1020;
    }
    
    /* 🟢 CORRECTION DU TABLEAU DES RÉSULTATS */
    .race-table { width:100%; border-collapse:collapse; }
    .race-table th, .race-table td { 
      padding: 10px 12px; /* Un peu plus d'espace pour respirer */
      border-bottom: 1px solid #1e293b; 
      text-align: left; /* Aligne tout à gauche de manière stricte */
      vertical-align: middle;
    }
    .race-table th { 
      color: var(--text-muted); 
      font-weight: 600; 
      border-bottom: 2px solid #334155; /* Sépare bien l'en-tête du reste */
    }
    .muted-note { color:#94a3b8; font-size:.9rem; }

    /* Tableaux classements */
    .table-standings {width:100%;border-collapse:collapse;background:rgba(15,23,42,.6);border:1px solid #334155;border-radius:12px;overflow:hidden}
    .table-standings th,.table-standings td{padding:.75rem .9rem;border-bottom:1px solid #233047; text-align: left;}
    .table-standings thead th{background:rgba(51,65,85,.5);}
    .rank-badge {display:inline-block;min-width:2rem;text-align:center;background:#0b1220;border:1px solid #334155;border-radius:999px;padding:.2rem .5rem}

    /* Loader animé (spinner) */
    .loading-inline {display:flex;align-items:center;gap:.6rem;color:#cbd5e1}
    .loading-inline .spinner{width:28px;height:28px;border:3px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="global-navbar"></div>
  <script type="module" src="nav.js" defer></script>

  <div class="container" style="margin-top: 3rem;">
    <h2>Archives EstaCup - Saison 9</h2>
    <p style="text-align: center; margin-bottom: 2rem; color: var(--text-muted);">
      Consultez les résultats historiques et les classements finaux de la Saison 9.
    </p>

    <nav class="menu">
      <button data-section="results">Résultats des Manches</button>
      <button data-section="rankpilots">Classement Pilotes</button>
      <button data-section="rankteams">Classement Équipes</button>
    </nav>

    <!-- SECTION RÉSULTATS -->
    <section id="section-results" class="section">
      <h3>Résultats de la saison</h3>
      <p class="muted-note">Cliquez sur une course pour afficher le <strong>classement complet</strong>.</p>
      <ul id="raceHistory"><li>Chargement…</li></ul>
    </section>

    <!-- SECTION CLASSEMENT PILOTES -->
    <section id="section-rankpilots" class="section hidden">
      <h3>Classement Final Pilotes</h3>
      <div id="estacupPilotStandings" class="course-box">
        <p>Chargement…</p>
      </div>
    </section>

    <!-- SECTION CLASSEMENT ÉQUIPES -->
    <section id="section-rankteams" class="section hidden">
      <h3>Classement Final Équipes</h3>
      <div id="estacupTeamStandings" class="course-box">
        <p>Chargement…</p>
      </div>
    </section>
  </div>
</body>
</html>

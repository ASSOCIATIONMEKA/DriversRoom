<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion - ESTACUP</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="login.js" defer></script>
</head>
<body>
  <!-- Injection dynamique de la navbar -->
  <div id="global-navbar"></div>
  <script type="module" src="nav.js" defer></script>

  <div class="container" style="max-width: 600px; margin-top: 4rem;">
    <h2 id="formTitle">Connexion</h2>

    <!-- ================= SECTION CONNEXION ================= -->
    <div id="loginSection">
      <form id="loginForm" autocomplete="on">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email" required />
        <input type="password" id="loginPassword" placeholder="Mot de passe" autocomplete="current-password" required />

        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
          <button type="submit">Se connecter</button>
          <button type="button" id="forgotPassword" class="linklike" style="background:none;border:none;color:#38bdf8;text-decoration:underline;cursor:pointer;padding:0;">
            Mot de passe oublié ?
          </button>
        </div>
      </form>

      <div style="margin-top: 2rem; border-top: 1px solid var(--border-primary); padding-top: 1.5rem; text-align: center;">
        <p class="muted" style="margin-bottom: 1rem;">Pas encore de compte ?</p>
        <button id="showRegister" style="background: linear-gradient(135deg, var(--border-secondary), var(--border-primary));">Créer un compte</button>
      </div>
    </div>

    <!-- ================= SECTION INSCRIPTION ================= -->
    <div id="registerSection" class="hidden">
      <form id="registerForm" autocomplete="on">
        <div style="display: flex; gap: 1rem;">
          <input type="text" id="firstName" placeholder="Prénom" required style="flex: 1;" />
          <input type="text" id="lastName" placeholder="Nom" required style="flex: 1;" />
        </div>
        
        <label for="dob" style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Date de naissance</label>
        <input type="date" id="dob" required />

        <!-- NOUVEAU : Liste déroulante des rôles -->
        <label for="registerRole" style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Rôle principal</label>
        <select id="registerRole" required>
          <option value="" disabled selected>-- Sélectionnez votre rôle --</option>
          <option value="Pilote">🏎️ Pilote</option>
          <option value="Ingénieur / Stratège">💻 Ingénieur / Stratège</option>
          <option value="Spectateur / Fan">🏁 Spectateur / Fan</option>
          <option value="Streamer / Commentateur">🎙️ Streamer / Commentateur</option>
          <option value="Staff / Orga">🛠️ Staff / Organisation</option>
          <option value="Autre">Autre</option>
        </select>

        <input type="email" id="registerEmail" placeholder="Email" required />
        <input type="password" id="registerPassword" placeholder="Mot de passe" required />
        <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe" required />
        
        <button type="submit" style="width: 100%;">Valider l'inscription</button>
      </form>

      <div style="margin-top: 2rem; border-top: 1px solid var(--border-primary); padding-top: 1.5rem; text-align: center;">
        <p class="muted" style="margin-bottom: 1rem;">Déjà inscrit ?</p>
        <button id="showLogin" style="background: linear-gradient(135deg, var(--border-secondary), var(--border-primary));">Retour à la connexion</button>
      </div>
    </div>

    <!-- ZONE DE MESSAGES -->
    <p id="error" class="error" style="text-align: center; margin-top: 1rem;"></p>
    <p id="success" class="success" style="text-align: center; margin-top: 1rem; color: var(--accent-success);"></p>
  </div>
  <!-- MODALE MOT DE PASSE OUBLIÉ -->
<div id="forgotPasswordModal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 9999; display: flex; align-items: center; justify-content: center;">
  <div class="course-box" style="max-width: 400px; width: 90%; text-align: center; padding: 2.5rem 2rem;">
    <h3 style="margin-top: 0; color: var(--accent-primary);">Mot de passe oublié ?</h3>
    <p class="muted-note" style="margin-bottom: 1.5rem; line-height: 1.5;">Saisissez l'adresse email associée à votre compte. Nous vous enverrons un lien sécurisé pour le réinitialiser.</p>
    
    <input type="email" id="resetEmailInput" placeholder="Votre adresse email" style="margin-bottom: 1rem; width: 100%;" />
    
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button id="btnCancelReset" style="flex: 1; background: transparent; border: 1px solid var(--border-secondary); color: var(--text-secondary); box-shadow: none;">Annuler</button>
      <button id="btnConfirmReset" style="flex: 1; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));">Envoyer</button>
    </div>
    
    <p id="resetMessage" style="margin-top: 1rem; font-size: 0.9rem; font-weight: 600; min-height: 20px;"></p>
  </div>
</div>
</body>
</html>

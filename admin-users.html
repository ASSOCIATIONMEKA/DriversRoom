<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Gestion Utilisateurs & Licences - EstaCup</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="nav.js" defer></script>
  <script type="module" src="admin-users.js" defer></script>
</head>
<body>

  <!-- Injection dynamique de la navbar -->
  <div id="global-navbar"></div>

  <div class="container" style="margin-top: 3rem; max-width: 1300px;">
    <h2>🛠️ Gestion des Utilisateurs & Licences</h2>
    <p style="text-align: center; margin-bottom: 2rem; color: var(--text-muted);">
      Liste complète des membres inscrits. Définissez le rôle, la licence, ou accordez les accès administrateur.
    </p>

    <div id="msgBox" class="msg-box hidden"></div>

    <div id="loading" style="text-align: center; padding: 2rem; color: var(--accent-primary);">
      Chargement de la base des membres...
    </div>

    <div id="usersSection" class="hidden">
      <div style="overflow-x: auto; width: 100%; background: rgba(15, 23, 42, 0.6); border-radius: 12px; border: 1px solid var(--border-primary); padding: 1rem;">
        <table class="admin-table" style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
          <thead>
            <tr style="border-bottom: 2px solid var(--border-primary); text-align: left;">
              <th style="padding: 1rem; color: var(--text-muted); width: 22%;">Membre</th>
              <th style="padding: 1rem; color: var(--text-muted); width: 25%;">Email</th>
              <th style="padding: 1rem; color: var(--text-muted); width: 17%;">Rôle</th>
              <th style="padding: 1rem; color: var(--text-muted); width: 16%;">Licence</th>
              <th style="padding: 1rem; color: var(--text-muted); text-align: right; width: 20%;">Actions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            </tbody>
        </table>
      </div>
    </div>
  </div>

</body>
</html>
